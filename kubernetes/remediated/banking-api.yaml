apiVersion: v1
kind: Namespace
metadata:
  name: banking-remediated
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-api
  namespace: banking-remediated
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-api-nginx
  namespace: banking-remediated
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        access_log /dev/stdout;
        error_log /dev/stderr warn;

        location / {
            default_type application/json;
            return 200 '{"service":"banking-api","status":"healthy"}';
        }

        location /health {
            default_type application/json;
            access_log off;
            return 200 '{"status":"healthy"}';
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-api
  namespace: banking-remediated
  labels:
    app.kubernetes.io/name: banking-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: banking-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: banking-platform
    spec:
      serviceAccountName: banking-api
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: banking-api
          image: nginxinc/nginx-unprivileged@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10101
            runAsGroup: 10101
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-configuration
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-runtime
              mountPath: /var/run
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: nginx-configuration
          configMap:
            name: banking-api-nginx
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: banking-api
  namespace: banking-remediated
  labels:
    app.kubernetes.io/name: banking-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: banking-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-api-default-deny
  namespace: banking-remediated
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banking-api
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-api-allowed-traffic
  namespace: banking-remediated
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banking-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53