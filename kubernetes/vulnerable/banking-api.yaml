# Intentionally vulnerable Kubernetes manifest.
# Authorized local security training only.
# Do not deploy to any production or Internet-accessible cluster.

apiVersion: v1
kind: Namespace
metadata:
  name: banking-vulnerable

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-api
  namespace: banking-vulnerable
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banking-api-vulnerable-role
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: banking-api-vulnerable-binding
subjects:
  - kind: ServiceAccount
    name: banking-api
    namespace: banking-vulnerable
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: banking-api-vulnerable-role

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-api-config
  namespace: banking-vulnerable
data:
  APP_ENV: "training"
  LOG_LEVEL: "debug"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-api
  namespace: banking-vulnerable
  labels:
    app: banking-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-api
  template:
    metadata:
      labels:
        app: banking-api
    spec:
      serviceAccountName: banking-api
      automountServiceAccountToken: true
      hostNetwork: true
      hostPID: true
      containers:
        - name: banking-api
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: banking-api-config
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - ALL
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: banking-api
  namespace: banking-vulnerable
spec:
  type: LoadBalancer
  selector:
    app: banking-api
  ports:
    - name: http
      port: 80
      targetPort: 80